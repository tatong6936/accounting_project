_schema-version: 3.3.0
ID: accounting
version: 1.0.0
description: "Hospital Accounting CAP Service"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - node -e "require('fs').copyFileSync('server.js','gen/srv/server.js')"
        - node -e "const fs=require('fs'); fs.mkdirSync('gen/srv/srv/wsdl',{recursive:true}); fs.copyFileSync('srv/wsdl/JOURNALENTRYCREATEREQUESTCONFI.wsdl','gen/srv/srv/wsdl/JOURNALENTRYCREATEREQUESTCONFI.wsdl');"

modules:
  - name: accounting-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: accounting-auth
      - name: accounting-postgres
      - name: accounting-destination
      - name: central-config-auth-binding

resources:
  - name: accounting-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: accounting-demo
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"

  - name: accounting-postgres
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: my-cap-postgres-db

  - name: accounting-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: central-config-auth-binding
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: central-config-auth
